<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070f22">
  <meta name="description" content="Ankh & Ankole — a modern identity concept inspired by the Ankh and Ankole cattle heritage, developed for Ankhole Technologies.">
  <title>Ankh &amp; Ankole — Ankhole Technologies</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #070f22; color: #e8eefb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px 20px; background: radial-gradient(ellipse at 50% 35%, #14264a 0, #070f22 68%); }
    main { width: min(100%, 760px); text-align: center; }
    .logo { display: block; width: min(100%, 460px); height: auto; margin: 0 auto 34px; }
    h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.8rem); letter-spacing: -.04em; }
    p { max-width: 560px; margin: 16px auto 28px; color: #aab8d0; line-height: 1.7; }
    a { color: #e3c45d; text-underline-offset: 4px; }
    .back { display: inline-block; margin-top: 28px; padding: 11px 18px; border: 1px solid #53627d; border-radius: 999px; text-decoration: none; }
    .back:hover { border-color: #D4AF37; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/ankh-and-ankole.svg" alt="Ankh & Ankole gold logo: an Ankh integrated with sweeping Ankole horns">
    <h1>Ankh &amp; Ankole</h1>
    <p>A visual identity concept for Ankhole Technologies, bringing together the Ankh as a symbol of life and the sweeping horns of Ankole cattle as a nod to heritage.</p>
    <a href="https://github.com/GeeRadebe/Ankhole" target="_blank" rel="noopener noreferrer">Explore the Ankhole repository →</a>
    <br>
    <a class="back" href="./">Back to Tefo’s portfolio</a>
  </main>
</body>
</html>
